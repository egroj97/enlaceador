name: Release Installer

on:
  push:
    tags:
      - 'v*'
      - 'v*.*'
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          arch: 'win64_mingw'
          tools: 'tools_mingw tools_cmake tools_ninja'
          cache: true

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build Qt Project
        shell: pwsh
        run: |
          .\build.ps1

      - name: Verify installer exists
        shell: pwsh
        run: |
          $setupExe = "dist\installer\enlaceadorSetup.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Error "Installer not found at $setupExe"
            exit 1
          }
          $size = [math]::Round((Get-Item $setupExe).Length / 1MB, 2)
          Write-Host "Installer ready: $setupExe ($size MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/enlaceadorSetup.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
